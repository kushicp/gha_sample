apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: man_appr_workflow
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: A sample manifest should go here, to help user
metadata:
  stages/v1alpha1:
    - name: kcp-env
      jobs:
        - deploy-to-kcp-env
        - deploy_success
jobs:
  deploy-to-kcp-env:
    steps:
      - name: Deploy to kcp-env
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo "Deploying to kcp-env"
    needs: []
  deploy_success:
    needs:
      - deploy-to-kcp-env
    timeout-minutes: 4320
    with:
      instructions: ""
      disallowLaunchByUser: false
      approvers: 0a808e26-f884-11ec-aa0a-42010a83ae55
      notifyAllEligibleUsers: false
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
