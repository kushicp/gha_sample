apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: register-and-deploy-artifact

on:
  workflow_dispatch:
jobs:
  buildArtRegTest:
    steps:
      - id: registerBuildArtifact
        name: catalog action test
        with:
          version: "15.93"
          url: docker.io/myapp/kcpImg15:15.0
          digest: d1603
          labels:  "lbl15"
          name: kcpBuildTestRegister153
        uses: cloudbees-io/register-build-artifact@v2
      - name: Artifact Id output
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "Output param: ${{ steps.registerBuildArtifact.outputs.artifact-id }}"
  
  deploy-artifact:
    needs: registerBuildArtifact
    environment: kcp-env
    steps:
      - name: Deploy artifact to environment
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: ${{ needs.registerBuildArtifact.outputs.artifact-id }}
          target-environment: kcp-env